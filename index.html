<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VS Code Web IDE</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Codicons (VS Code Icons) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons/dist/codicon.css">

  <!-- Execution Engines -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jscpp@2.0.8/dist/JSCPP.es5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alasql@4"></script>

  <!-- Monaco Editor CDN (VS Code Core Engine) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
</head>
<body>

  <div class="vscode-container">
    <!-- Activity Bar (Far Left Icon Strip) -->
    <aside class="activity-bar">
      <div class="icon active" title="Explorer"><i class="codicon codicon-files"></i></div>
      <div class="icon" title="Run & Debug"><i class="codicon codicon-run-all"></i></div>
      <div class="icon" title="Settings"><i class="codicon codicon-settings-gear"></i></div>
    </aside>

    <!-- Sidebar Explorer -->
    <aside class="sidebar">
      <div class="sidebar-title">EXPLORER</div>
      <div class="file-tree">
        <div class="file active" data-lang="python"><i class="codicon codicon-file-code"></i> main.py</div>
        <div class="file" data-lang="cpp"><i class="codicon codicon-file-code"></i> main.cpp</div>
        <div class="file" data-lang="javascript"><i class="codicon codicon-file-code"></i> app.js</div>
        <div class="file" data-lang="html"><i class="codicon codicon-file-code"></i> index.html</div>
        <div class="file" data-lang="sql"><i class="codicon codicon-database"></i> query.sql</div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="editor-workspace">
      <!-- Editor Header & Run Control -->
      <div class="editor-tabs">
        <div class="tab active">
          <span id="current-tab-name">main.py</span>
        </div>
        <div class="tab-actions">
          <button id="run-btn" title="Run Code (Ctrl+Enter)"><i class="codicon codicon-play"></i> Run Code</button>
        </div>
      </div>

      <!-- Split Screen: Monaco Editor + Console -->
      <div class="editor-body">
        <div id="monaco-editor-container"></div>
        <div class="terminal-panel">
          <div class="terminal-header">
            <span>TERMINAL / OUTPUT</span>
            <button id="clear-btn"><i class="codicon codicon-clear-all"></i> Clear</button>
          </div>
          <div id="terminal-output" class="terminal-console">Ready to run code...</div>
          <iframe id="web-preview" class="hidden-preview"></iframe>
        </div>
      </div>

      <!-- VS Code Status Bar -->
      <footer class="status-bar">
        <div class="status-left">
          <span id="status-engine"><i class="codicon codicon-sync spin"></i> Loading Engines...</span>
        </div>
        <div class="status-right">
          <span id="status-lang">Python</span>
          <span>UTF-8</span>
          <span>Spaces: 4</span>
        </div>
      </footer>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
