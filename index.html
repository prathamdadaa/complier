<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dada Code Compiler</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <div class="stamp">
      <span class="d1">DA</span><span class="d2">DA</span>
      <span class="rest">CODE · COMPILER</span>
    </div>
    <div class="tagline">cut-up type, disciplined runtime — an in-browser HTML/CSS/JS playground</div>
  </div>
  <div class="actions">
    <button id="runBtn" title="Run (Ctrl/Cmd + Enter)">▶ Run</button>
    <button class="ghost-btn" id="resetBtn">Reset</button>
  </div>
</header>

<div class="tabbar">
  <div class="tab html active" data-lang="html">index.html</div>
  <div class="tab css" data-lang="css">style.css</div>
  <div class="tab js" data-lang="js">script.js</div>
</div>

<main>
  <div class="editor-pane">
    <div class="cm-wrap">
      <div class="editor-slot active" id="slot-html"></div>
      <div class="editor-slot" id="slot-css"></div>
      <div class="editor-slot" id="slot-js"></div>
    </div>
  </div>

  <div class="preview-pane">
    <div class="preview-bar">
      <div class="dots"><span></span><span></span><span></span></div>
      <span>live preview</span>
      <span></span>
    </div>
    <iframe id="preview" title="preview" sandbox="allow-scripts allow-modals"></iframe>

    <div class="console" id="console">
      <div class="console-bar" id="consoleToggle">
        <div class="left"><span class="caret">▾</span><span>Console</span></div>
        <button class="clear-console" id="clearConsole">clear</button>
      </div>
      <div class="console-body" id="consoleBody">
        <div class="console-empty">// output will appear here on run</div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>

<script src="script.js"></script>
</body>
</html>
