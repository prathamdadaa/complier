<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DADA COMPILER</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Pyodide (Python WebAssembly) -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <!-- JSCPP (C++ WebAssembly/Interpreter) -->
  <script src="https://cdn.jsdelivr.net/npm/jscpp@2.0.8/dist/JSCPP.es5.min.js"></script>
  <!-- alasql (Browser SQL Engine) -->
  <script src="https://cdn.jsdelivr.net/npm/alasql@4"></script>
</head>
<body>

  <header class="navbar">
    <div class="logo">⚡ DADA COMPILER STUDIO </div>
    <div class="controls">
      <label for="language-select">Language:</label>
      <select id="language-select">
        <option value="python">Python 3</option>
        <option value="cpp">C++ (STD 11)</option>
        <option value="javascript">JavaScript (ES6)</option>
        <option value="html">HTML & CSS</option>
        <option value="sql">SQL (In-Memory)</option>
        <option value="bash">Bash Scripting</option>
      </select>
      <button id="run-btn">▶ Run Code</button>
    </div>
  </header>

  <main class="workspace">
    <!-- Code Input Panel -->
    <section class="panel editor-panel">
      <div class="panel-header">
        <span id="file-label">main.py</span>
        <span id="status-tag" class="tag ready">System Ready</span>
      </div>
      <textarea id="code-editor" spellcheck="false"></textarea>
    </section>

    <!-- Output Panel -->
    <section class="panel output-panel">
      <div class="panel-header">Output Console / Preview</div>
      <div id="terminal-output" class="console"></div>
      <iframe id="web-preview" class="hidden-preview"></iframe>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
